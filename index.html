<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Image</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #ffffff; /* image has a white background, so keep the page white */
        --text: #1a1a1a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { padding: 24px; text-align: center; }
    img {
      max-width: 100%;
      height: auto;
      width: 800px;
    }
  </style>
</head>
<body>
  <main>
    <img src="images/lightning.png" alt="Red race car with a big smile">
  </main>
</body>
</html>
